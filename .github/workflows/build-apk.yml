name: Build PuzzleVerse APK (Android, debug)

# DEBUG APK only, for testing, not a signed release APK.
# v2: generates the Tauri Android project in CI, so you do NOT
# need to commit src-tauri/gen/android/ beforehand.
# If this run still fails, send the log of the step that failed
# and the workflow will be adjusted from that exact error.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # v3: do NOT download JDK via setup-java (that step was failing).
      # GitHub-hosted ubuntu runners already ship JDK 17 preinstalled
      # at $JAVA_HOME_17_X64, so just point JAVA_HOME at it.
      - name: Use preinstalled JDK 17
        run: |
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
          ls "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version

      # v4: do NOT use android-actions/setup-android (that step was
      # failing in both v2 and v3 runs). Ubuntu runners already ship
      # an Android SDK at $ANDROID_HOME, so just use it directly.
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || ls /usr/local/lib/android/sdk || true
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || sdkmanager --version

      - name: Install Android platform, build-tools and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate placeholder icon if missing
        run: |
          if [ ! -f "src-tauri/icons/icon.png" ]; then
            mkdir -p src-tauri/icons
            python3 -m pip install --quiet pillow
            python3 - <<'PY'
            from PIL import Image, ImageDraw
            img = Image.new('RGB', (512, 512), (99, 102, 241))
            d = ImageDraw.Draw(img)
            for x, y, c in [(40,40,(129,140,248)), (280,40,(167,139,250)), (40,280,(52,211,153)), (280,280,(251,191,36))]:
                d.rounded_rectangle([x, y, x+190, y+190], radius=36, fill=c)
            d.text((256, 256), "P", fill=(255,255,255), anchor="mm")
            img.save('src-tauri/icons/icon.png')
            print('icon generated')
            PY
          fi
          ls -lh src-tauri/icons/icon.png

      - name: Generate Tauri Android project if missing
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            yes "" | cargo tauri android init
          fi
          ls src-tauri/gen/android

      - name: Install web dependencies and build frontend
        run: |
          npm ci
          npm run build

      - name: Build Android debug APK with Tauri
        run: cargo tauri android build --debug

      - name: List built APKs
        run: find src-tauri/gen/android -name "*.apk" -print || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleVerse-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
