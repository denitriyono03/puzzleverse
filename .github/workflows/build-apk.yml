name: Build PuzzleVerse APK (Android, debug)

# DEBUG APK only, for testing, not a signed release APK.
# v2: generates the Tauri Android project in CI, so you do NOT
# need to commit src-tauri/gen/android/ beforehand.
# If this run still fails, send the log of the step that failed
# and the workflow will be adjusted from that exact error.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # v3: do NOT download JDK via setup-java (that step was failing).
      # GitHub-hosted ubuntu runners already ship JDK 17 preinstalled
      # at $JAVA_HOME_17_X64, so just point JAVA_HOME at it.
      - name: Use preinstalled JDK 17
        run: |
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
          ls "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version

      # v4: do NOT use android-actions/setup-android (that step was
      # failing in both v2 and v3 runs). Ubuntu runners already ship
      # an Android SDK at $ANDROID_HOME, so just use it directly.
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || ls /usr/local/lib/android/sdk || true
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || sdkmanager --version

      - name: Install Android platform, build-tools and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # v7: icon below is RGBA, not RGB. Tauri's generate_context!()
      # panics with 'icon ... is not RGBA' on an RGB PNG, which was
      # the exact failure in run 40766273116. Base64 of the local
      # 512x512 RGBA icon; no heredoc, no pip install here.
      - name: Generate placeholder icon if missing
        run: |
          if [ ! -f "src-tauri/icons/icon.png" ]; then
            mkdir -p src-tauri/icons
            echo "" | base64 -d > src-tauri/icons/icon.png
          fi
          ls -lh src-tauri/icons/icon.png

      - name: Generate Tauri Android project if missing
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            yes "" | cargo tauri android init
          fi
          ls src-tauri/gen/android

      - name: Install web dependencies and build frontend
        run: |
          npm ci
          npm run build

      # v6: capture the build log so a future failure is diagnosable
      # even though job logs need admin rights to download.
      - name: Build Android debug APK with Tauri
        run: |
          set -o pipefail
          cargo tauri android build --debug 2>&1 | tee tauri-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log
          if-no-files-found: ignore

      # v8: Tauri Android puts the APK in a per-ABI subfolder
      # (e.g. outputs/apk/arm64-v8a/debug/), not necessarily in
      # outputs/apk/debug/, so the old glob found nothing and the
      # upload failed even though the build itself succeeded.
      # Collect every *.apk under gen/android into one folder first.
      - name: Collect built APKs
        run: |
          mkdir -p apk-out
          find src-tauri/gen/android -name "*.apk" -exec cp {} apk-out/ \;
          ls -lh apk-out/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleVerse-debug-apk
          path: apk-out/*.apk
          if-no-files-found: error
